name: Build KwikScript for Apple Silicon

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run lint
          npx next typegen
          npx tsc --noEmit
          npm run typecheck:electron
          npm run test:i18n
          npm run test:timeline

      - name: Build unsigned Apple-Silicon app
        run: npm run dist

      - name: Verify native package
        run: |
          test -x "dist/mac-arm64/KwikScript.app/Contents/Resources/native/rescript-coreml-transcriber"
          test "$(find 'dist/mac-arm64/KwikScript.app/Contents/Resources' -type f \( -path '*/vendor/ort/*' -o -path '*/vendor/ort-parakeet/*' \) | wc -l | tr -d ' ')" = "0"

      - name: Upload unsigned test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KwikScript-mac-arm64-unsigned
          path: |
            dist/KwikScript-mac-arm64.dmg
            dist/KwikScript-mac-arm64.zip
          if-no-files-found: error

# These workflow artifacts are for testing, not polished distribution. A
# click-to-install public release still needs a Developer ID Application
# certificate and Apple notarization credentials.
